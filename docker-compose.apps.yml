# Mode B - full container POC. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up --build -d --wait
# Startup order: postgres healthy -> flyway-migration completed -> backend healthy -> frontends.
# Uses the same host ports as Mode A, so stop host dev servers first.
services:
  modulithplatformservice:
    build: ./services/modulithplatformservice
    image: chat-platform/modulithplatformservice:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chatplatform}?currentSchema=platform
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-platform_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?run scripts/dev-setup.ps1 to create .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY:?run scripts/dev-setup.ps1}
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY:?run scripts/dev-setup.ps1}
      CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_HMAC_SECRET_KEY:?run scripts/dev-setup.ps1}
      APP_SESSION_TOKEN_HMAC_SECRET_KEY: ${APP_SESSION_TOKEN_HMAC_SECRET_KEY:?run scripts/dev-setup.ps1}
      APP_LOCAL_ADMIN_TOKEN: ${APP_LOCAL_ADMIN_TOKEN:?run scripts/dev-setup.ps1}
      APP_LOCAL_DEV_ENABLED: ${APP_LOCAL_DEV_ENABLED:-true}
      APP_SEED_WIDGET_KEY: ${APP_SEED_WIDGET_KEY:-wk_local_demo}
      ALLOCATION_URL: http://allocation-service:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - '127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      flyway-migration:
        condition: service_completed_successfully
      centrifugo:
        condition: service_healthy
      otel-collector:
        condition: service_started
      allocation-service:
        condition: service_healthy
    restart: unless-stopped

  chatdashboardapp:
    build:
      context: .
      dockerfile: apps/chatdashboardapp/Dockerfile
    image: chat-platform/chatdashboardapp:local
    environment:
      # Read at request time by the server component; must be host-browser reachable URLs.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
      PUBLIC_WIDGET_DEMO_URL: ${PUBLIC_WIDGET_DEMO_URL:-http://localhost:5173}
      PUBLIC_CENTRIFUGO_WS_URL: ${PUBLIC_CENTRIFUGO_WS_URL:-ws://localhost:8000/connection/websocket}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
    ports:
      - '127.0.0.1:${DASHBOARD_HOST_PORT:-3000}:3000'
    depends_on:
      modulithplatformservice:
        condition: service_healthy
    restart: unless-stopped

  chatwidget:
    build:
      context: .
      dockerfile: apps/chatwidget/Dockerfile
    image: chat-platform/chatwidget:local
    ports:
      - '127.0.0.1:${WIDGET_HOST_PORT:-5173}:8080'
    depends_on:
      modulithplatformservice:
        condition: service_healthy
    restart: unless-stopped

  # Scrape only the backend container in this mode (the host target would see the same process via the
  # published port and double every series). Same target path => replaces the base file's mount.
  prometheus:
    volumes:
      - ./infra/observability/prometheus.containers.yml:/etc/prometheus/prometheus.yml:ro
