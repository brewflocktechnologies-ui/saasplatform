# CI for the chat-platform monorepo. Assumes this folder is the Git repository root.
# Extension points (not implemented yet): image publishing, signing (cosign), SBOM, environment promotion.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  frontend:
    name: Frontend lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx show projects
      - name: Affected checks (pull requests)
        if: github.event_name == 'pull_request'
        run: >
          pnpm nx affected -t lint typecheck test build
          --base=origin/${{ github.base_ref }} --head=HEAD
          --exclude=modulithplatformservice,flyway-migration,platform-tests
      - name: Full checks (push / no base SHA)
        if: github.event_name != 'pull_request'
        run: >
          pnpm nx run-many -t lint typecheck test build
          --exclude=modulithplatformservice,flyway-migration,platform-tests

  contracts-and-config:
    name: Contracts + Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:validate
      - name: Compose config (placeholders only, no secrets)
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.apps.yml config -q

  backend:
    name: Backend (JDK 25, Maven Wrapper, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/modulithplatformservice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  e2e:
    name: E2E against the full container stack
    runs-on: ubuntu-latest
    needs: [frontend, contracts-and-config, backend]
    steps:
      - uses: actions/checkout@v7
      - name: Create ephemeral .env with random CI-only secrets
        run: |
          while IFS= read -r line; do
            if [[ "$line" =~ ^([A-Z0-9_]+)=__generate__$ ]]; then
              echo "${BASH_REMATCH[1]}=$(openssl rand -hex 24)"
            else
              echo "$line"
            fi
          done < .env.example > .env
      - name: Start full stack (infra + migrations + app images)
        run: docker compose -f docker-compose.yml -f docker-compose.apps.yml up --build -d --wait
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.apps.yml logs --no-color --tail=200
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: dist/.playwright/tests/report
          retention-days: 7
