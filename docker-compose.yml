# Local infrastructure: PostgreSQL, Flyway (one-shot), Centrifugo and the observability stack.
# Start:  docker compose up -d --wait        Stop (keeps data):  docker compose stop   or   docker compose down
# Host ports bind to 127.0.0.1 only. Image tags are pinned; see docs/setup/tool-versions.md.
name: chat-platform

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatplatform}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-platform_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run scripts/dev-setup.ps1 to create .env}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-platform_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?run scripts/dev-setup.ps1 to create .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-platform_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?run scripts/dev-setup.ps1 to create .env}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  flyway-migration:
    build: ./database/flywayMigration
    image: chat-platform/flyway-migration:local
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chatplatform}
      FLYWAY_USER: ${POSTGRES_MIGRATOR_USER:-platform_migrator}
      FLYWAY_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?run scripts/dev-setup.ps1 to create .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  centrifugo:
    image: centrifugo/centrifugo:v6.10.2
    command: centrifugo --config=/centrifugo/config.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY:?run scripts/dev-setup.ps1 to create .env}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY:?run scripts/dev-setup.ps1 to create .env}
    ports:
      - '127.0.0.1:${CENTRIFUGO_HOST_PORT:-8000}:8000'
    volumes:
      - ./infra/centrifugo/config.json:/centrifugo/config.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '127.0.0.1:${OTEL_GRPC_HOST_PORT:-4317}:4317'
      - '127.0.0.1:${OTEL_HTTP_HOST_PORT:-4318}:4318'
      - '127.0.0.1:${OTEL_HEALTH_HOST_PORT:-13133}:13133'
    # Image is distroless (no shell/wget); readiness is checked from the host at http://localhost:13133/ (verify-local.ps1).
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1
    command: ['-target=all', '-config.file=/etc/tempo.yaml']
    user: '10001'
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '127.0.0.1:${TEMPO_HOST_PORT:-3200}:3200'
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - '127.0.0.1:${LOKI_HOST_PORT:-3100}:3100'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/dev-setup.ps1 to create .env}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000'
    depends_on:
      - prometheus
      - tempo
      - loki
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || curl -fs http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
