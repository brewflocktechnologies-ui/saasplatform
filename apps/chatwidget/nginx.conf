server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    # Public static bundle with no secrets; module scripts are CORS-fetched when embedded on another origin.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        # /demo -> demo/index.html without a redirect
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Versioned embed entry point (filename carries the API version, not a content hash): short cache.
    location /embed/ {
        expires 5m;
    }

    location /assets/ {
        expires 1y;
    }
}
