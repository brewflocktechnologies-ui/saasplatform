openapi: 3.1.0
info:
  title: Chat Platform API
  version: 0.2.0
  description: |
    Public HTTP contract of `modulithplatformservice`. Contract-first: change this file in the same PR as the
    implementation; `pnpm contracts:validate` lints it and `tests/contract` checks live responses against it.

    **`/api/v1/demo/*` is a LOCAL POC — NOT REAL AUTHENTICATION.** The caller names itself with `actorId`,
    restricted to `userone` (visitor) and `agentbob` (agent); roles are derived on the server. Real-time events are
    described in `libs/contracts/asyncapi/chat-realtime.yaml`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
security: []
tags:
  - name: platform
    description: Platform status and setup proof
  - name: demo-chat
    description: Chat MVP with hardcoded demo identities (local POC only)
  - name: demo-realtime
    description: Short-lived Centrifugo tokens for the demo identities (local POC only)
paths:
  /api/v1/demo/conversations:
    post:
      operationId: ensureDemoConversation
      summary: Get or create the single open demo conversation of userone (assigned to agentbob)
      tags: [demo-chat]
      responses:
        '200':
          description: The existing open conversation was reused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: The conversation was created by this request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listAgentConversations
      summary: Agent inbox, most recent activity first
      tags: [demo-chat]
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200':
          description: Conversations assigned to the agent.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/demo/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listMessages
      summary: Persisted messages of a conversation, ascending by creation time
      tags: [demo-chat]
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200':
          description: Message history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: sendMessage
      summary: Persist a message, then publish message.created via Centrifugo
      description: |
        The message is committed before publication. `realtimeDelivery: FAILED` means the message **is saved**
        but the live event could not be published — do not resend; other clients will see it on their next
        history load. Text is trimmed; empty text or more than 4000 characters is rejected.
      tags: [demo-chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
            examples:
              visitor:
                value: { actorId: userone, text: 'Hello, can you help me?' }
      responses:
        '201':
          description: Message persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageResponse' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/demo/realtime/connection-token:
    get:
      operationId: getConnectionToken
      summary: Short-lived Centrifugo connection JWT (sub = actorId)
      tags: [demo-realtime]
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200':
          description: Signed token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeToken' }
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/demo/realtime/subscription-token:
    get:
      operationId: getSubscriptionToken
      summary: Short-lived Centrifugo subscription JWT bound to actor and exact channel
      description: |
        agentbob may subscribe to `chat:inbox` and to `chat:conversation:<id>` of conversations assigned to them;
        userone only to their own `chat:conversation:<id>`.
      tags: [demo-realtime]
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - name: channel
          in: query
          required: true
          schema: { type: string, examples: ['chat:inbox'] }
      responses:
        '200':
          description: Signed token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeToken' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Application status and safe dependency status
      description: Never exposes secrets, connection strings or stack traces.
      tags: [platform]
      responses:
        '200':
          description: Status report. `status` is DEGRADED when any dependency is DOWN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                healthy:
                  value:
                    application: modulithplatformservice
                    version: 0.1.0
                    environment: local
                    status: UP
                    timestamp: '2026-10-25T10:00:00Z'
                    dependencies:
                      database: { status: UP, detail: schema version 1 }
                      centrifugo: { status: UP, detail: health endpoint OK }
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      summary: Latest setup record created by the Flyway bootstrap migration
      tags: [platform]
      responses:
        '200':
          description: Bootstrap record read from PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapRecord'
              examples:
                local:
                  value:
                    id: 1
                    setupKey: local-poc
                    message: Flyway migration V1 applied; backend can read PostgreSQL.
                    createdAt: '2026-10-25T10:00:00Z'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    ActorId:
      name: actorId
      in: query
      required: true
      description: Demo actor (LOCAL POC — not authentication).
      schema:
        type: string
        enum: [userone, agentbob]
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error in RFC 9457 problem-details format.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The database is unavailable.
                instance: /api/v1/bootstrap
  schemas:
    DependencyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        detail:
          type: [string, 'null']
          description: Short, safe human-readable detail.
    StatusResponse:
      type: object
      required: [application, version, environment, status, timestamp, dependencies]
      properties:
        application: { type: string }
        version: { type: string }
        environment: { type: string }
        status:
          type: string
          enum: [UP, DEGRADED]
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          required: [database, centrifugo]
          properties:
            database: { $ref: '#/components/schemas/DependencyStatus' }
            centrifugo: { $ref: '#/components/schemas/DependencyStatus' }
          additionalProperties:
            $ref: '#/components/schemas/DependencyStatus'
    BootstrapRecord:
      type: object
      required: [id, setupKey, message, createdAt]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        setupKey: { type: string }
        message: { type: string }
        createdAt:
          type: string
          format: date-time
    Conversation:
      $ref: '../json-schema/chat/conversation.v1.schema.json'
    ChatMessage:
      $ref: '../json-schema/chat/message.v1.schema.json'
    SendMessageRequest:
      type: object
      required: [actorId, text]
      properties:
        actorId:
          type: string
          enum: [userone, agentbob]
        text:
          type: string
          maxLength: 4000
          description: Trimmed by the server; must not be blank.
    SendMessageResponse:
      type: object
      additionalProperties: false
      required: [message, realtimeDelivery]
      properties:
        message: { $ref: '#/components/schemas/ChatMessage' }
        realtimeDelivery:
          type: string
          enum: [PUBLISHED, FAILED]
          description: FAILED = persisted, but the live event was not published (do not resend).
    RealtimeToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: HS256 JWT for Centrifugo. Never log it.
        expiresAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
