openapi: 3.1.0
info:
  title: Chat Platform API
  version: 0.3.0
  description: |
    Public HTTP contract of `modulithplatformservice`. Contract-first: change this file in the same PR as the
    implementation; `pnpm contracts:validate` lints it and `tests/contract` checks live responses against it.

    **Identity.** Widget and agent endpoints require a bearer session token (`bearerAuth`): contacts get one from
    `POST /api/v1/widget/sessions` (public widget key), agents from `POST /api/v1/agent/local-login`. Both are HS256
    JWTs bound to one tenant. **`/api/v1/agent/local-login` is a LOCAL POC â€” NOT REAL AUTHENTICATION**: it issues an
    agent session without a password and exists only when `app.local-dev.enabled=true`.

    **`/api/v1/demo/*` is a LOCAL POC â€” NOT REAL AUTHENTICATION.** The caller names itself with `actorId`,
    restricted to `userone` (visitor) and `agentbob` (agent); roles are derived on the server. It stays until the demo
    module is removed. Real-time events are described in `libs/contracts/asyncapi/chat-realtime.yaml`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
security: []
tags:
  - name: platform
    description: Platform status and setup proof
  - name: widget
    description: Visitor session and conversation API (contact bearer session)
  - name: agent
    description: Dashboard API (agent bearer session)
  - name: demo-chat
    description: Chat MVP with hardcoded demo identities (local POC only)
  - name: demo-realtime
    description: Short-lived Centrifugo tokens for the demo identities (local POC only)
paths:
  /api/v1/widget/sessions:
    post:
      operationId: createWidgetSession
      summary: Start or refresh a contact session from a public widget key
      description: |
        A public `widgetKey` selects the inbox (and thereby the tenant). With `externalId` the known contact is reused,
        otherwise an anonymous contact is created. Sending a stored (possibly expired) `sessionToken` refreshes the same
        contact for up to 30 days after the session's first issue, keeping the original `auth_time`.
      tags: [widget]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetSessionRequest' }
      responses:
        '201':
          description: A new contact session was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetSessionResponse' }
        '200':
          description: The stored session token was refreshed for the same contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetSessionResponse' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: The supplied sessionToken is invalid, expired beyond its refresh window or of another kind.
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/widget/conversations:
    post:
      operationId: startOrResumeWidgetConversation
      summary: Start a conversation, or resume the contact's latest non-archived one
      tags: [widget]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: A conversation was created (`assignment.state = REQUESTED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationView' }
        '200':
          description: The existing conversation was resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationView' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/widget/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: getWidgetConversation
      summary: The caller's conversation, with unread count and reduced assignment
      tags: [widget]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationView' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/widget/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listWidgetMessages
      summary: Paginated history, ascending by sequence
      description: |
        `before` walks older pages, `after` is the catch-up path, neither returns the newest page. Passing both is 400.
        `limit` is clamped to 200.
      tags: [widget]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: sendWidgetMessage
      summary: Send a message (idempotent by clientMessageId)
      description: |
        The message, the conversation update and the `message.created` outbox row commit together. Replaying the same
        `clientMessageId` with the same trimmed body returns the original message (200); a different body is 409
        `CLIENT_MESSAGE_ID_REUSED`. Limited to 30 accepted requests per minute per principal.
      tags: [widget]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageBody' }
      responses:
        '201':
          description: The message was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageView' }
        '200':
          description: Idempotent replay of an existing message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageView' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/widget/conversations/{conversationId}/read:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    put:
      operationId: markWidgetRead
      summary: Advance the caller's read cursor (clamped to the conversation head, monotonic)
      tags: [widget]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadRequest' }
      responses:
        '204':
          description: The cursor was advanced (or left unchanged).
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/local-login:
    post:
      operationId: localAgentLogin
      summary: Issue an agent session for an existing roster agent (local development only)
      description: |
        LOCAL POC â€” NOT REAL AUTHENTICATION. Served only while `app.local-dev.enabled=true`; the response is a short-lived
        agent session token. Production replaces this with OIDC.
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentLoginRequest' }
      responses:
        '200':
          description: Agent session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSessionResponse' }
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/inboxes:
    get:
      operationId: listAgentInboxes
      summary: Inboxes of the agent's tenant
      tags: [agent]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The tenant's inboxes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InboxView' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/inboxes/{inboxId}/conversations:
    parameters:
      - $ref: '#/components/parameters/InboxId'
    get:
      operationId: listInboxConversations
      summary: Conversation list of one inbox (queue, mine or all; archived toggle; cursor paging)
      description: |
        `view=queue` lists waiting work (`REQUESTED`, `QUEUED`, `FAILED`, `REOPEN_PENDING`), `view=mine` lists the
        caller's assignments, `view=all` everything not filtered by the archive toggle. The cursor is opaque; a page never
        repeats or skips a conversation.
      tags: [agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [queue, mine, all], default: all }
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of conversations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxPage' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: getAgentConversation
      summary: One conversation with the full assignment view (agent callers only)
      tags: [agent]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationView' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listAgentMessages
      summary: Paginated history, ascending by sequence
      tags: [agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: sendAgentMessage
      summary: Reply to a conversation (idempotent by clientMessageId)
      description: |
        Any agent of the tenant may reply to any non-archived, non-resolved conversation; the reply adds an `AGENT`
        participant. A resolved conversation must be reopened first (`409 CONVERSATION_RESOLVED`).
      tags: [agent]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageBody' }
      responses:
        '201':
          description: The message was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageView' }
        '200':
          description: Idempotent replay of an existing message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageView' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/conversations/{conversationId}/read:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    put:
      operationId: markAgentRead
      summary: Advance the agent's read cursor
      tags: [agent]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadRequest' }
      responses:
        '204':
          description: The cursor was advanced (or left unchanged).
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/conversations/{conversationId}/assign:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: assignConversation
      summary: Claim, auto-assign or reassign through the allocation service (Plan 04)
      description: |
        Implemented by the allocation integration. Until it lands, the route answers `501 NOT_IMPLEMENTED`.
        The `Idempotency-Key` header is required once the route is functional.
      tags: [agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRequest' }
      responses:
        '200':
          description: The conversation's assignment after the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationView' }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '501':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/conversations/{conversationId}/resolve:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: resolveConversation
      summary: Resolve a conversation (releases the assignment)
      tags: [agent]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200':
          description: The conversation after the command (a repeated command is a no-op).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationView' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/conversations/{conversationId}/reopen:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: reopenConversation
      summary: Reopen a conversation (requests a new assignment)
      tags: [agent]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200':
          description: The conversation after the command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationView' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/conversations/{conversationId}/pending:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: markConversationPending
      summary: Mark the conversation as waiting for the contact
      tags: [agent]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200':
          description: The conversation after the command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationView' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/conversations/{conversationId}/archive:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: archiveConversation
      summary: Archive a conversation (releases the assignment; independent of status)
      tags: [agent]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200':
          description: The conversation after the command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationView' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/agent/conversations/{conversationId}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: unarchiveConversation
      summary: Unarchive a conversation (an open or pending one requests a new assignment)
      tags: [agent]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200':
          description: The conversation after the command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationView' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/demo/conversations:
    post:
      operationId: ensureDemoConversation
      summary: Get or create the single open demo conversation of userone (assigned to agentbob)
      tags: [demo-chat]
      responses:
        '200':
          description: The existing open conversation was reused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: The conversation was created by this request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listAgentConversations
      summary: Agent inbox, most recent activity first
      tags: [demo-chat]
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200':
          description: Conversations assigned to the agent.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/demo/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/DemoConversationId'
    get:
      operationId: listMessages
      summary: Persisted messages of a conversation, ascending by creation time
      tags: [demo-chat]
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200':
          description: Message history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: sendMessage
      summary: Persist a message, then publish message.created via Centrifugo
      description: |
        The message is committed before publication. `realtimeDelivery: FAILED` means the message **is saved**
        but the live event could not be published â€” do not resend; other clients will see it on their next
        history load. Text is trimmed; empty text or more than 4000 characters is rejected.
      tags: [demo-chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoSendMessageRequest' }
            examples:
              visitor:
                value: { actorId: userone, text: 'Hello, can you help me?' }
      responses:
        '201':
          description: Message persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageResponse' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/demo/realtime/connection-token:
    get:
      operationId: getConnectionToken
      summary: Short-lived Centrifugo connection JWT (sub = actorId)
      tags: [demo-realtime]
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200':
          description: Signed token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeToken' }
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/demo/realtime/subscription-token:
    get:
      operationId: getSubscriptionToken
      summary: Short-lived Centrifugo subscription JWT bound to actor and exact channel
      description: |
        agentbob may subscribe to `chat:inbox` and to `chat:conversation:<id>` of conversations assigned to them;
        userone only to their own `chat:conversation:<id>`.
      tags: [demo-realtime]
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - name: channel
          in: query
          required: true
          schema: { type: string, examples: ['chat:inbox'] }
      responses:
        '200':
          description: Signed token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeToken' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/outbox:
    get:
      operationId: listOutboxEvents
      summary: Inspect outbox rows by status (local-dev operator API)
      description: LOCAL POC — NOT REAL AUTHENTICATION; served only while `app.local-dev.enabled=true`.
      tags: [platform]
      security: [{ AdminToken: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDING, PUBLISHED, PARKED] }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Outbox rows, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OutboxEventView' }
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/outbox/{eventId}/replay:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: replayOutboxEvent
      summary: Requeue a parked event (attempts reset, next attempt now)
      tags: [platform]
      security: [{ AdminToken: [] }]
      responses:
        '200':
          description: The event after the replay (PENDING).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboxEventView' }
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Application status and safe dependency status
      description: Never exposes secrets, connection strings or stack traces.
      tags: [platform]
      responses:
        '200':
          description: Status report. `status` is DEGRADED when any dependency is DOWN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                healthy:
                  value:
                    application: modulithplatformservice
                    version: 0.1.0
                    environment: local
                    status: UP
                    timestamp: '2026-10-25T10:00:00Z'
                    dependencies:
                      database: { status: UP, detail: schema version 3 }
                      centrifugo: { status: UP, detail: health endpoint OK }
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      summary: Latest setup record created by the Flyway bootstrap migration
      tags: [platform]
      responses:
        '200':
          description: Bootstrap record read from PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapRecord'
              examples:
                local:
                  value:
                    id: 1
                    setupKey: local-poc
                    message: Flyway migration V1 applied; backend can read PostgreSQL.
                    createdAt: '2026-10-25T10:00:00Z'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session JWT from `POST /api/v1/widget/sessions` (contact) or `POST /api/v1/agent/local-login` (agent).
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: LOCAL POC — NOT REAL AUTHENTICATION. Local-dev operator API only.
  parameters:
    ActorId:
      name: actorId
      in: query
      required: true
      description: Demo actor (LOCAL POC â€” not authentication).
      schema:
        type: string
        enum: [userone, agentbob]
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Platform conversation id.
      schema:
        type: string
        format: uuid
    DemoConversationId:
      name: conversationId
      in: path
      required: true
      description: Demo conversation id.
      schema:
        type: string
        format: uuid
    InboxId:
      name: inboxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Before:
      name: before
      in: query
      required: false
      description: Return messages older than this sequence (newest page when omitted).
      schema: { type: integer, format: int64, minimum: 1 }
    After:
      name: after
      in: query
      required: false
      description: Return messages newer than this sequence (catch-up). Mutually exclusive with `before`.
      schema: { type: integer, format: int64, minimum: 0 }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size; clamped to 200 for messages and 100 for inbox pages.
      schema: { type: integer, minimum: 1, default: 50 }
  responses:
    Problem:
      description: Error in RFC 9457 problem-details format with a stable `code`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                code: DATABASE_UNAVAILABLE
                detail: The database is unavailable.
                instance: /api/v1/bootstrap
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  schemas:
    DependencyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        detail:
          type: [string, 'null']
          description: Short, safe human-readable detail.
    StatusResponse:
      type: object
      required: [application, version, environment, status, timestamp, dependencies]
      properties:
        application: { type: string }
        version: { type: string }
        environment: { type: string }
        status:
          type: string
          enum: [UP, DEGRADED]
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          required: [database, centrifugo]
          properties:
            database: { $ref: '#/components/schemas/DependencyStatus' }
            centrifugo: { $ref: '#/components/schemas/DependencyStatus' }
          additionalProperties:
            $ref: '#/components/schemas/DependencyStatus'
    BootstrapRecord:
      type: object
      required: [id, setupKey, message, createdAt]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        setupKey: { type: string }
        message: { type: string }
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          minLength: 1
          description: |
            Stable machine-readable code: `UNAUTHENTICATED`, `FORBIDDEN`, `NOT_FOUND`, `VALIDATION_FAILED`,
            `RATE_LIMITED`, `CLIENT_MESSAGE_ID_REUSED`, `CONVERSATION_RESOLVED`, `CONVERSATION_ARCHIVED`,
            `INVALID_TRANSITION`, `STALE_VERSION`, `CONVERSATION_ACTIVE_EXISTS`, `ALLOCATION_REJECTED`,
            `ALLOCATION_UNAVAILABLE`, `DATABASE_UNAVAILABLE`, `NOT_IMPLEMENTED`, or a status-derived framework code.
        traceId:
          type: string
          description: Correlation id, identical to the `X-Trace-Id` response header.
        reasonCodes:
          type: array
          items: { type: string }
    WidgetSessionRequest:
      type: object
      additionalProperties: false
      required: [widgetKey]
      properties:
        widgetKey: { type: string, minLength: 1, maxLength: 200 }
        externalId: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        sessionToken:
          type: string
          description: A stored (possibly expired) contact session to refresh.
    WidgetSessionResponse:
      type: object
      additionalProperties: false
      required: [sessionToken, expiresAt, tenantId, inbox, contact]
      properties:
        sessionToken: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        tenantId: { type: string, minLength: 1, maxLength: 63 }
        inbox:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        contact:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: [string, 'null'] }
    AgentLoginRequest:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId: { type: string, minLength: 1, maxLength: 128 }
        tenantId: { type: string, minLength: 1, maxLength: 63 }
    AgentSessionResponse:
      type: object
      additionalProperties: false
      required: [sessionToken, expiresAt, tenantId, agentId, displayName]
      properties:
        sessionToken: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        tenantId: { type: string, minLength: 1, maxLength: 63 }
        agentId: { type: string, minLength: 1, maxLength: 128 }
        displayName: { type: string }
    InboxView:
      type: object
      additionalProperties: false
      required: [id, name, widgetKey, allocationQueueId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        widgetKey: { type: string }
        allocationQueueId: { type: string }
    ConversationView:
      $ref: '../json-schema/chat/conversation.v1.schema.json'
    MessageView:
      $ref: '../json-schema/chat/message.v1.schema.json'
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MessageView' }
        hasMore: { type: boolean }
    OutboxEventView:
      type: object
      additionalProperties: false
      required: [eventId, tenantId, eventType, status, attempts, nextAttemptAt, createdAt]
      properties:
        eventId: { type: string, format: uuid }
        tenantId: { type: string }
        eventType: { type: string }
        status: { type: string, enum: [PENDING, PUBLISHED, PARKED] }
        attempts: { type: integer, minimum: 0 }
        nextAttemptAt: { type: string, format: date-time }
        lastError: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
    InboxPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConversationView' }
        nextCursor: { type: [string, 'null'] }
    SendMessageBody:
      type: object
      additionalProperties: false
      required: [clientMessageId, body]
      properties:
        clientMessageId:
          type: string
          minLength: 1
          maxLength: 64
          description: Stable per browser client; scopes idempotency to (conversation, sender type, sender id).
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: Trimmed by the server; 1 to 4000 code points.
    CommandRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic guard; a mismatch is 409 STALE_VERSION.
        reason:
          type: string
          maxLength: 500
          description: Stored in the state event (and as archive_reason for an archive).
    ReadRequest:
      type: object
      additionalProperties: false
      required: [lastReadSequence]
      properties:
        lastReadSequence:
          type: integer
          format: int64
          minimum: 0
          description: Clamped to the conversation head; the cursor never moves backwards.
    AssignRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [AUTO, CLAIM, REASSIGN] }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    Conversation:
      $ref: '../json-schema/chat/demo-conversation.v1.schema.json'
    ChatMessage:
      $ref: '../json-schema/chat/demo-message.v1.schema.json'
    DemoSendMessageRequest:
      type: object
      required: [actorId, text]
      properties:
        actorId:
          type: string
          enum: [userone, agentbob]
        text:
          type: string
          maxLength: 4000
          description: Trimmed by the server; must not be blank.
    SendMessageResponse:
      type: object
      additionalProperties: false
      required: [message, realtimeDelivery]
      properties:
        message: { $ref: '#/components/schemas/ChatMessage' }
        realtimeDelivery:
          type: string
          enum: [PUBLISHED, FAILED]
          description: FAILED = persisted, but the live event was not published (do not resend).
    RealtimeToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: HS256 JWT for Centrifugo. Never log it.
        expiresAt:
          type: string
          format: date-time
