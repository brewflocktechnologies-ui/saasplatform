asyncapi: 3.0.0
info:
  title: Chat Platform realtime
  version: 1.0.0
  description: |
    Centrifugo channels of the conversation platform. Delivery is **at least once**: a client dedupes by `eventId` and
    the message `id`/`sequence`, and always reconciles from the HTTP API on every (re)subscribe (`?after=<lastSequence>`).
    The `chat` namespace stores a short history (`history_size` 100, `history_ttl` 300s, `force_recovery` true) as an
    optimisation only; it is never the source of truth.

    Browsers subscribe with a short-lived subscription JWT issued by the backend for one exact channel; they never see an
    API key or an HMAC secret. Clients may not publish.
defaultContentType: application/json
servers:
  local:
    host: localhost:8000
    protocol: ws
    pathname: /connection/websocket
    description: Centrifugo (local). Connection JWT from the widget/agent realtime token endpoints.
channels:
  conversation:
    address: 'chat:conversation:{conversationId}'
    description: One conversation. Readable by its contact and every agent of the tenant.
    parameters:
      conversationId:
        description: Conversation UUID.
    messages:
      messageCreated:
        $ref: '#/components/messages/messageCreated'
      conversationUpdated:
        $ref: '#/components/messages/conversationUpdated'
      typing:
        $ref: '#/components/messages/typing'
  inbox:
    address: 'chat:inbox:{tenantId}:{inboxId}'
    description: Inbox of a tenant; agents only. Carries conversation lifecycle and message refresh signals.
    parameters:
      tenantId:
        description: Tenant id (no colon; it is a channel segment).
      inboxId:
        description: Inbox UUID.
    messages:
      conversationCreated:
        $ref: '#/components/messages/conversationCreated'
      conversationUpdated:
        $ref: '#/components/messages/conversationUpdated'
      messageCreated:
        $ref: '#/components/messages/messageCreated'
operations:
  receiveConversationEvents:
    action: receive
    summary: Subscriber receives conversation events.
    channel:
      $ref: '#/channels/conversation'
    messages:
      - $ref: '#/channels/conversation/messages/messageCreated'
      - $ref: '#/channels/conversation/messages/conversationUpdated'
      - $ref: '#/channels/conversation/messages/typing'
  receiveInboxEvents:
    action: receive
    summary: Agent receives inbox signals.
    channel:
      $ref: '#/channels/inbox'
    messages:
      - $ref: '#/channels/inbox/messages/conversationCreated'
      - $ref: '#/channels/inbox/messages/conversationUpdated'
      - $ref: '#/channels/inbox/messages/messageCreated'
components:
  messages:
    messageCreated:
      name: message.created
      title: Message created
      summary: A message was persisted and its outbox row published.
      payload:
        $ref: '../json-schema/chat/message-created.v1.schema.json'
    conversationCreated:
      name: conversation.created
      title: Conversation created
      summary: A conversation was created; the assignment is REQUESTED.
      payload:
        $ref: '../json-schema/chat/conversation-created.v1.schema.json'
    conversationUpdated:
      name: conversation.updated
      title: Conversation updated
      summary: One state write or assignment projection change; the version increased by exactly one.
      payload:
        $ref: '../json-schema/chat/conversation-updated.v1.schema.json'
    typing:
      name: typing
      title: Typing indicator
      summary: Ephemeral, never persisted, never in the outbox.
      payload:
        $ref: '../json-schema/chat/typing.v1.schema.json'
