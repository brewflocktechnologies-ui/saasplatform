# Environment-driven configuration. Host mode (pnpm dev:backend) reads the repo-root .env;
# container mode receives the same variables from docker-compose.apps.yml. Never put secrets here.
spring:
  application:
    name: modulithplatformservice
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/${POSTGRES_DB:chatplatform}?currentSchema=platform}
    username: ${POSTGRES_APP_USER:platform_app}
    password: ${POSTGRES_APP_PASSWORD:}
    hikari:
      # Start even when PostgreSQL is down so /api/v1/status can report the failure.
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

app:
  version: '@project.version@'
  environment: ${APP_ENVIRONMENT:local}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  centrifugo:
    # Server-to-server URL (host mode: localhost; container mode: http://centrifugo:8000). Never sent to browsers.
    url: ${CENTRIFUGO_URL:http://localhost:8000}
    api-key: ${CENTRIFUGO_HTTP_API_KEY:}
    connection-token-secret: ${CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY:}
    subscription-token-secret: ${CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_HMAC_SECRET_KEY:}
    token-ttl: ${CENTRIFUGO_TOKEN_TTL:5m}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${APP_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  metrics:
    tags:
      application: ${spring.application.name}
