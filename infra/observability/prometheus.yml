global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  # The backend runs either on the host (Mode A: pnpm dev:backend) or as a container (Mode B).
  # Both targets are listed; only the one for the active mode is UP. Dashboards use max(up{job=...}).
  - job_name: modulithplatformservice
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          mode: host
      - targets: ['modulithplatformservice:8080']
        labels:
          mode: container
