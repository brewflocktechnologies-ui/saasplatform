global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  # Mode A: backend runs on the host (pnpm dev:backend). Mode B replaces this file with prometheus.containers.yml
  # (see docker-compose.apps.yml) so each mode has exactly one backend target and no double-counted series.
  - job_name: modulithplatformservice
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          mode: host
